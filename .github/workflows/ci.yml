name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Smoke test — library API
        run: |
          python -c "import driftsentinel; print('version:', driftsentinel.__version__)"
          python -c "
          import driftsentinel as ds
          # Clean spec → 100
          a = ds.compute_adi({'oasdiff':{},'vacuum':{'by_severity':{}},'schemathesis':{}}, **ds.ADI_DEFAULTS)
          assert a['score'] == 100.0, f'clean: expected 100, got {a[\"score\"]}'
          # Apocalypse → 0
          a = ds.compute_adi({'oasdiff':{'breaking_count':9999},'vacuum':{'by_severity':{'error':9999,'warn':9999}},'schemathesis':{'failures':9999}}, **ds.ADI_DEFAULTS)
          assert a['score'] == 0.0, f'apocalypse: expected 0, got {a[\"score\"]}'
          # 1 breaking → 90
          a = ds.compute_adi({'oasdiff':{'breaking_count':1},'vacuum':{'by_severity':{}},'schemathesis':{}}, **ds.ADI_DEFAULTS)
          assert a['score'] == 90.0, f'1-breaking: expected 90, got {a[\"score\"]}'
          print('all clamp tests pass')
          "

      - name: CLI smoke
        run: |
          driftsentinel --help
          oas-sentinel --help
          driftsentinel keygen --out /tmp/test-key

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
